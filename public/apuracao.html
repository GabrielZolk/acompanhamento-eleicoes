<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apuração Eleitoral 2026</title>
  <meta name="description" content="Acompanhe em tempo real a apuração das Eleições 2026 com dados oficiais do TSE." />
  <meta name="theme-color" content="#0a0e16" />
  <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="radar" id="radar" title="Checando o TSE a cada 5 segundos" aria-hidden="true"><i></i></div>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Página inicial">
        <img class="brand__logo" src="img/logo.svg" alt="" width="58" height="58" />
        <span class="brand__text">
          <span class="brand__title">Apuração Eleitoral <em>2026</em></span>
          <span class="brand__sub">Acompanhe em tempo real os resultados em todo o Brasil</span>
        </span>
      </a>

      <nav class="tabs" aria-label="Cargos">
        <button class="tabs__item" data-cargo="presidente">Presidente</button>
        <button class="tabs__item" data-cargo="governador">Governadores</button>
        <button class="tabs__item" data-cargo="senado">Senado</button>
        <button class="tabs__item" data-cargo="camara">Deputados</button>
        <div class="tabs__menu">
          <button class="tabs__item tabs__item--menu" id="consultas-btn" aria-haspopup="true" aria-expanded="false">
            Consultas
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="dropdown" id="consultas-menu" role="menu" hidden></div>
        </div>
      </nav>

      <div class="search" role="search">
        <svg class="search__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search-input" type="search" placeholder="Buscar estado ou município..." autocomplete="off" aria-label="Buscar estado ou município" />
        <kbd class="search__kbd" id="search-kbd">⌘ K</kbd>
        <div class="search__results" id="search-results" role="listbox" hidden></div>
      </div>

      <div class="live" id="live-status" aria-live="polite"></div>
    </header>

    <main class="grid">
      <section class="card disputa" id="disputa"></section>

      <section class="card mapa" id="mapa">
        <div class="card__head">
          <div>
            <h2 class="card__title">Mapa do Brasil</h2>
            <p class="card__sub" id="mapa-sub">Percentual do candidato mais votado em cada estado</p>
          </div>
          <div class="mapa__ctrl">
          <div class="seg seg--lg" id="mapa-nivel" role="group" aria-label="Detalhe do mapa">
            <button data-nivel="uf" class="is-on" aria-pressed="true">Estados</button>
            <button data-nivel="mun" aria-pressed="false">Cidades</button>
          </div>
          <label class="select">
            <select id="mapa-modo" aria-label="Modo do mapa"></select>
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </label>
          </div>
        </div>
        <div class="mapa__stage" id="mapa-stage">
          <div class="mapa__dica" id="mapa-dica" hidden></div>
          <svg class="mapa__svg" id="mapa-svg" role="img" aria-label="Mapa do Brasil por estado"></svg>
          <div class="mapa__overlay" id="mapa-overlay"></div>
          <div class="mapa__tooltip" id="mapa-tooltip" hidden></div>
          <div class="zoom" role="group" aria-label="Zoom do mapa">
            <button data-zoom="in" aria-label="Aproximar"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
            <button data-zoom="out" aria-label="Afastar"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
            <button data-zoom="reset" aria-label="Recentralizar"><svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="1.6" fill="currentColor"/><path d="M9 1.5v3M9 13.5v3M1.5 9h3M13.5 9h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          </div>
          <div class="legend" id="mapa-legenda"></div>
        </div>
      </section>

      <div class="coluna">
        <section class="card regioes" id="regioes"></section>
        <section class="card resumo" id="resumo"></section>
        <section class="card updates" id="updates"></section>
      </div>
    </main>

    <div class="bottom">
      <section class="card evolucao" id="evolucao"></section>
      <section class="card previsao" id="previsao"></section>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" data-close aria-label="Fechar">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
